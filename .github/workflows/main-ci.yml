name: Full CI Pipeline

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]

jobs:
    changes:
        runs-on: ubuntu-latest
        outputs:
            backend: ${{ steps.changes.outputs.backend }}
            frontend: ${{ steps.changes.outputs.frontend }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Check for changes
              uses: dorny/paths-filter@v3
              id: changes
              with:
                  filters: |
                      backend:
                        - 'backend/**'
                      frontend:
                        - 'frontend/**'

    backend-ci:
        needs: changes
        if: ${{ needs.changes.outputs.backend == 'true' }}
        uses: ./.github/workflows/backend-ci.yml

    frontend-ci:
        needs: changes
        if: ${{ needs.changes.outputs.frontend == 'true' }}
        uses: ./.github/workflows/frontend-ci.yml

    docker-build-test:
        runs-on: ubuntu-latest
        needs: [changes]
        if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' }}

        strategy:
            matrix:
                service: [backend, frontend]
                include:
                    - service: backend
                      dockerfile: backend/Dockerfile.dev
                      context: backend
                    - service: frontend
                      dockerfile: frontend/Dockerfile.dev
                      context: frontend

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build Docker image for ${{ matrix.service }}
              run: |
                  docker build -f ${{ matrix.dockerfile }} -t talentmatch-${{ matrix.service }}:test ${{ matrix.context }}

            - name: Test Docker image
              run: |
                  docker run --rm talentmatch-${{ matrix.service }}:test echo "Docker build successful"

    integration-test:
        runs-on: ubuntu-latest
        needs: [backend-ci, frontend-ci]
        if: ${{ always() && (needs.backend-ci.result == 'success' || needs.backend-ci.result == 'skipped') && (needs.frontend-ci.result == 'success' || needs.frontend-ci.result == 'skipped') }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Start services with Docker Compose
              run: |
                  docker-compose -f docker-compose.dev.yml up -d --build

            - name: Wait for services to be ready
              run: |
                  sleep 30
                  curl -f http://localhost:8080/actuator/health || exit 1
                  curl -f http://localhost:3000 || exit 1

            - name: Run integration tests
              run: |
                  echo "Integration tests would run here"
                  # Add your integration test commands here

            - name: Stop services
              if: always()
              run: |
                  docker-compose -f docker-compose.dev.yml down
